name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Linux DNS
        if: runner.os == 'Linux'
        run: |
          sudo resolvectl dns eth0 1.1.1.1 1.0.0.1
          sudo resolvectl flush-caches
          resolvectl status
          getent hosts archive.ubuntu.com
          getent hosts security.ubuntu.com

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel 1 --verbose